<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>买房算一算 · 无锡楼市全量地图</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0c1422"/>
<style>
:root{--bg:#070d17;--line:#1d2b44;--txt:#e7eef9;--mut:#8ea4c2;--mut2:#6b81a1;--acc:#38bdf8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--txt);font-size:14px;-webkit-font-smoothing:antialiased;padding-bottom:40px}
a{color:var(--acc);text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:rgba(7,13,23,.94);backdrop-filter:blur(10px);z-index:500}
.topbar .sp{flex:1}
h1{font-size:21px;margin:18px 0 6px}
.sub{color:var(--mut);font-size:12px;line-height:1.6;margin-bottom:16px}
h2{font-size:13px;color:#8fb3d9;letter-spacing:1px;margin:22px 0 10px;display:flex;align-items:center;gap:7px}
h2::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--acc)}
.card{border:1px solid var(--line);border-radius:12px;background:#0b1524;padding:14px}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.f label{flex:1;min-width:130px;font-size:11px;color:var(--mut2)}
input,select{width:100%;margin-top:4px;background:#0d1828;border:1px solid var(--line);color:var(--txt);
  border-radius:7px;padding:8px 10px;font-size:14px;outline:none}
input:focus,select:focus{border-color:var(--acc)}
.out{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.out div{background:linear-gradient(180deg,#101c2f,#0d1728);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.out .k{font-size:10.5px;color:var(--mut2)}
.out .v{font-size:20px;font-weight:800;color:#ffd48a;margin-top:3px;letter-spacing:-.5px}
.out .v small{font-size:11px;color:#8f7538;font-weight:500;margin-left:2px}
.blk{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);
  border-radius:9px;margin-bottom:6px;background:#0e1a2c}
.blk .n{font-size:13.5px;font-weight:600}
.blk .m{font-size:10.5px;color:var(--mut2);margin-top:2px}
.blk .p{font-size:15px;font-weight:800;color:#ffd48a;text-align:right}
.blk .p small{display:block;font-size:9.5px;color:var(--mut2);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid #16223a}
th{color:var(--mut2);font-weight:500;font-size:11px}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:10.5px;color:#5f7899;line-height:1.7;margin-top:10px}
.empty{color:var(--mut2);font-size:12.5px;padding:14px 0}
#loading{padding:70px 0;text-align:center;color:var(--mut2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a href="./">← 返回地图</a><span class="sp"></span><a href="detail.html?i=0" id="sampleLink" style="display:none">看示例详情</a></div>
  <h1>买房算一算</h1>
  <div class="sub">先算清「我买得起哪」，再去看地图。所有结果都是估算，实际以银行审批和房源报价为准。</div>

  <div class="card">
    <div class="f">
      <label>首付能拿出的钱（万元）<input id="down" type="number" value="60" min="0"></label>
      <label>每月能承受月供（元）<input id="mpay" type="number" value="6000" min="0" step="100"></label>
    </div>
    <div class="f">
      <label>想买多大（㎡）<input id="area" type="number" value="90" min="20" max="300"></label>
      <label>贷款年限<select id="year"><option>20</option><option selected>30</option></select></label>
      <label>首付比例<select id="ratio"><option value="0.2">20%</option><option value="0.3" selected>30%</option><option value="0.4">40%</option><option value="0.5">50%</option></select></label>
      <label>年利率（%）<input id="rate" type="number" value="3.05" step="0.05"></label>
    </div>
    <div class="out" id="out"></div>
    <div class="note" id="formula"></div>
  </div>

  <h2>按你的预算，这些板块够得着</h2>
  <div id="blocks"><div id="loading">正在算…</div></div>

  <h2>买房要交的税（估算）</h2>
  <div class="card">
    <table>
      <thead><tr><th>税费</th><th>规则（无锡，普通住宅）</th><th class="r">估算</th></tr></thead>
      <tbody id="taxBody"></tbody>
    </table>
    <div class="note">契税：首套 ≤90㎡ 1%、&gt;90㎡ 1.5%；二套 ≤90㎡ 1%、&gt;90㎡ 2%（以家庭名下套数与最新政策为准）。增值税：满 2 年免征（普通住宅）。个税：满五唯一免征，否则通常按总价 1% 或差额 20%。本表仅作量级参考。</div>
  </div>

  <div class="note" style="margin-top:18px">数据：高德地图 POI + 公开市场行情（2026年11月）。板块价格为参考均价，非单套报价，不构成购房建议。</div>
</div>

<script>
(function(){
  function loadData(cb){
    if(window.__WX2__) return cb();
    function fb(){var s=document.createElement('script');s.src='data.js';s.onload=cb;
      s.onerror=function(){document.getElementById('blocks').innerHTML='<div class="empty">数据加载失败</div>';};document.body.appendChild(s);}
    if(location.protocol==='file:'||!window.fetch||!window.DecompressionStream) return fb();
    var N=5,parts=[],jobs=[];
    for(var i=0;i<N;i++)(function(i){
      jobs.push(fetch('data.p'+i,{cache:'force-cache'}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();})
        .then(function(b){parts[i]=new Uint8Array(b);}));
    })(i);
    Promise.all(jobs).then(function(){
      var t=0;for(var i=0;i<N;i++)t+=parts[i].length;
      var all=new Uint8Array(t),o=0;for(var i=0;i<N;i++){all.set(parts[i],o);o+=parts[i].length;}
      return new Response(new Blob([all]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    }).then(function(s){(new Function(s))();cb();}).catch(fb);
  }

  function pmt(P,rate,years){
    var r=rate/12/100,n=years*12;
    if(r<=0) return P/n;
    return P*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);
  }
  // 由月供反推可贷本金
  function maxLoan(m,rate,years){
    var r=rate/12/100,n=years*12;
    if(r<=0) return m*n;
    return m*(Math.pow(1+r,n)-1)/(r*Math.pow(1+r,n));
  }

  window.__ON_DATA=function(){
    var D=window.__WX2__, B=D.blocks, ITEMS=D.items;
    var $=function(id){return document.getElementById(id);};
    var sample=ITEMS.findIndex(function(x){return x.t==='new';});
    if(sample>=0){var a=$('sampleLink');a.href='detail.html?i='+sample;a.style.display='inline';}

    function calc(){
      var down=+$('down').value||0;          // 万
      var m=+$('mpay').value||0;             // 元/月
      var area=+$('area').value||90;
      var years=+$('year').value;
      var rate=+$('rate').value;
      var ratio=+$('ratio').value;
      var loan=maxLoan(m,rate,years)/10000;   // 万
      var totalLoanCap=down/(1-ratio);        // 首付比例反推总价
      var total=Math.min(down+loan, totalLoanCap);
      var unit=total*10000/area;              // 元/㎡
      var realDown=total*ratio, realLoan=total-realDown;
      $('out').innerHTML=
        '<div><div class="k">能买的总价</div><div class="v">'+total.toFixed(0)+'<small>万</small></div></div>'
       +'<div><div class="k">可贷额度</div><div class="v">'+(total-realDown).toFixed(0)+'<small>万</small></div></div>'
       +'<div><div class="k">首付需付</div><div class="v">'+realDown.toFixed(1)+'<small>万</small></div></div>'
       +'<div><div class="k">单价上限</div><div class="v">'+Math.round(unit).toLocaleString()+'<small>元/㎡</small></div></div>';
      $('formula').textContent='总价取「首付+月供可贷」与「首付比例上限」两者较小值；按 '+area+'㎡、'+years+'年、年利率'+rate+'% 估算。';

      // 板块匹配（二手参考价，价低者优先推荐）
      var list=B.filter(function(b){return b.sp&&b.sp<=unit;})
                 .sort(function(a,b){return b.sp-a.sp;});
      var box=$('blocks');
      if(!list.length){
        box.innerHTML='<div class="empty">按这个预算，全市 57 个板块的参考价都高于你的单价上限（'+Math.round(unit)+' 元/㎡）。<br>可以试试：提高首付、延长年限、或缩小面积。</div>';
      }else{
        box.innerHTML=list.map(function(b){
          return '<a class="blk" href="detail.html?i='+firstOf(b)+'">'
            +'<div><div class="n">'+b.n+'</div><div class="m">'+b.r+' · '+b.cnt+' 个点位 · 二手参考</div></div>'
            +'<div class="p">'+(b.sp/10000).toFixed(2)+'<small>万/㎡</small></div></a>';
        }).join('');
      }
      // 税费
      var tb=$('taxBody');
      var deed = area<=90 ? (total*0.01) : (total*0.015);
      tb.innerHTML=
        '<tr><td>契税（首套）</td><td>≤90㎡ 1%，&gt;90㎡ 1.5%</td><td class="r">'+deed.toFixed(1)+' 万</td></tr>'
       +'<tr><td>增值税</td><td>满 2 年普通住宅免征</td><td class="r">0</td></tr>'
       +'<tr><td>个人所得税</td><td>满五唯一免征，否则约 1%</td><td class="r">'+(total*0.01).toFixed(1)+' 万（可能）</td></tr>'
       +'<tr><td>中介费</td><td>约 1%–2%（二手）</td><td class="r">'+(total*0.015).toFixed(1)+' 万</td></tr>'
       +'<tr><td><b>合计（不含个税）</b></td><td></td><td class="r"><b>'+(deed+total*0.015).toFixed(1)+' 万</b></td></tr>';
    }
    function firstOf(b){
      var i=ITEMS.findIndex(function(x){return x.b===B.indexOf(b);});
      return i<0?0:i;
    }
    ['down','mpay','area','year','rate','ratio'].forEach(function(id){
      $(id).addEventListener('input',calc);
      $(id).addEventListener('change',calc);
    });
    calc();
  };
  loadData(function(){ window.__ON_DATA(); });
})();
</script>
</body>
</html>
